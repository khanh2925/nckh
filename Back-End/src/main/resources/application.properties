spring.application.name=indoor-map-backend
server.port=${PORT:8080}
# DB_URL, DB_USERNAME, DB_PASSWORD có thể đặt trong Back-End/.env (git-ignored, xem .env.example).
# Biến môi trường thật (ví dụ trên Render) được ưu tiên hơn file này.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/airport_map}
spring.datasource.username=${DB_USERNAME:airport_map}
spring.datasource.password=${DB_PASSWORD:}
# Schema cài bằng tay từ database/v2/*.sql
spring.sql.init.mode=never

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# JPA ánh xạ lên schema có sẵn, không bao giờ tự sửa schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Lưu mạng lối đi chèn hàng nghìn dòng: gửi theo lô
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Tài khoản quản trị hệ thống đầu tiên (chỉ dùng khi bảng users còn trống, xem config/AdminBootstrap)
app.admin.email=${ADMIN_EMAIL:admin@indoormap.local}
app.admin.password=${ADMIN_PASSWORD:}
# Khoá ký token: chuỗi ngẫu nhiên dài trên máy chủ. Trống = khoá ngẫu nhiên mỗi lần khởi động.
app.jwt.secret=${JWT_SECRET:}
app.jwt.lifetime=8h
server.forward-headers-strategy=native

# Nén JSON: gói dữ liệu một địa điểm có thể tới vài trăm KB
server.compression.enabled=true
# Mặt bằng SVG có thể lớn
spring.servlet.multipart.max-file-size=10MB
server.tomcat.max-http-form-post-size=10MB
server.max-http-request-header-size=16KB

# Theo dõi lỗi (Sentry cloud hoặc GlitchTip, chỉ đổi DSN). SENTRY_DSN trống = tắt.
# Tự gửi: lỗi chưa xử lý trong controller, log.error; đo thời gian từng request (traces-sample-rate).
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.2}
sentry.send-default-pii=false
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=info
