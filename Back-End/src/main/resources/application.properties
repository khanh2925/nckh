spring.application.name=airport-map-backend
server.port=${PORT:8080}
# DB_URL, DB_USERNAME, DB_PASSWORD can be put in Back-End/.env (git-ignored, see .env.example).
# Real environment variables (e.g. on Render) win over that file.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/airport_map}
spring.datasource.username=${DB_USERNAME:airport_map}
spring.datasource.password=${DB_PASSWORD:}
# Schema and seed are installed explicitly using database/*.sql.
spring.sql.init.mode=never

# Keep idle serverless instances from holding database compute awake.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# JPA maps onto the existing schema in database/01_schema.sql and never alters it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Saving the walkway network inserts thousands of rows: send them to PostgreSQL in batches
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Admin login (see security/SecurityConfig). Everyone can read; add / edit / delete need the admin token.
# Without ADMIN_PASSWORD nobody can log in, so the API is read-only.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
# Signs the login tokens: a long random value on the server. Empty = a new random key at every start.
app.jwt.secret=${JWT_SECRET:}
app.jwt.lifetime=8h
# Use the visitor address sent by Render's proxy (X-Forwarded-For), for limiting wrong logins
server.forward-headers-strategy=native

# Send JSON gzipped: locations + walkways are ~500 KB, about 10x smaller compressed
server.compression.enabled=true
