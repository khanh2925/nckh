services:
  - type: web
    name: airport-map-api
    runtime: docker
    plan: free
    branch: main
    rootDir: Back-End
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/locations
    autoDeployTrigger: commit
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://aeroproce.aeroproce.workers.dev
      # Admin login: everyone can read, only the admin (after logging in) can add / edit / delete.
      # Type ADMIN_PASSWORD in the Render dashboard (Environment); until then nobody can log in.
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # Signs the login tokens; Render makes a random value once
      - key: JWT_SECRET
        generateValue: true
      # Error tracking: DSN of the Spring Boot project (aeroproce-api) on Sentry. A DSN only lets you send events, not read them
      - key: SENTRY_DSN
        value: https://4b813f9a52490ea3c9c7fad6cf62bc19@o4512436061339648.ingest.de.sentry.io/4512436084277328
      - key: SENTRY_ENVIRONMENT
        value: production
