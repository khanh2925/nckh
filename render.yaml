services:
  - type: web
    name: airport-map-api
    runtime: docker
    plan: free
    branch: main
    rootDir: Back-End
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/locations
    autoDeployTrigger: commit
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://aeroproce.aeroproce.workers.dev
      # Admin login: everyone can read, only the admin (after logging in) can add / edit / delete.
      # Type ADMIN_PASSWORD in the Render dashboard (Environment); until then nobody can log in.
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # Signs the login tokens; Render makes a random value once
      - key: JWT_SECRET
        generateValue: true
